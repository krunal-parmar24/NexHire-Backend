name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore, Build, Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore, Build and Format (backend)
        working-directory: backend
        run: |
          dotnet restore NexHire.sln
          dotnet build NexHire.sln -c Release --no-restore
          dotnet format NexHire.sln --verify-no-changes --no-restore || true

      - name: Run unit tests (if any test project exists)
        working-directory: backend
        run: |
          if ls **/*.Tests.csproj 1> /dev/null 2>&1; then
            dotnet test NexHire.sln -c Release --no-build --logger "console;verbosity=normal"
          else
            echo "No test projects found yet — step will activate automatically once one is added."
          fi
